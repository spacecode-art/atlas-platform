apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/spacecode-art/atlas-platform.git
    targetRevision: main
    path: charts/atlas-app
    helm:
      valuesObject:
        image:
          repository: nginxinc/nginx-unprivileged
          tag: "1.31.4-alpine"
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
